
name: Python CI

on:
  push:
    branches: [master, add-test-script]
  pull_request:
    branches: [master]

jobs:
  python-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Python script
        run: python test_miniapp.py
